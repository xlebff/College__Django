{% extends 'base.html' %}
{% block title %}Добавление зоны{% endblock %}

{% block content %}
<h1 class="mb-4">Новая игровая зона</h1>
<form method="post" class="row g-3">
    {% csrf_token %}
    {% for field in form %}
        <div class="col-md-6">
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger">{{ field.errors }}</div>
            {% endif %}
        </div>
    {% endfor %}
    <div class="col-12">
        <button type="submit" class="btn btn-success">Сохранить</button>
        <a href="{% url 'zone_list' %}" class="btn btn-secondary">Отмена</a>
    </div>
</form>
{% endblock %}
